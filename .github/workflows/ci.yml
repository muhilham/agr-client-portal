name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 10.8.x shipped with Node 20 crashes on `npm ci` with
          # "Exit handler never called!" since the vitest dependency graph
          # landed; Node 22 ships a fixed npm. Railway deploy is unaffected.
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: ESLint
        run: npm run lint
