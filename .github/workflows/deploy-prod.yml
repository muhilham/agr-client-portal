name: deploy-prod

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to deploy (e.g. v1.0.0). Used for rollback re-deploys.'
        required: true
        type: string

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $REF (must match v[0-9]+.[0-9]+.[0-9]+)"
            exit 1
          fi
          echo "Tag format valid: $REF"

  deploy:
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install sops and age
        run: |
          wget -qO sops.deb https://github.com/getsops/sops/releases/download/v3.9.0/sops_3.9.0_amd64.deb
          sudo dpkg -i sops.deb
          wget -qO age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          tar xzf age.tar.gz
          sudo mv age/age /usr/local/bin/
          sudo mv age/age-keygen /usr/local/bin/

      - name: Verify sops and age
        run: sops --version && age --version

      - name: Decrypt & sync production envs
        run: |
          export SOPS_AGE_KEY="${{ secrets.SOPS_AGE_KEY }}"
          node scripts/sync-env.mjs --env production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to production
        run: railway up --service agr-client-portal --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
