name: deploy-staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install sops and age
        run: |
          wget -qO sops.deb https://github.com/getsops/sops/releases/download/v3.9.0/sops_3.9.0_amd64.deb
          sudo dpkg -i sops.deb
          wget -qO age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
          tar xzf age.tar.gz
          sudo mv age/age /usr/local/bin/
          sudo mv age/age-keygen /usr/local/bin/

      - name: Verify sops and age
        run: sops --version && age --version

      - name: Decrypt & sync staging envs
        run: |
          export SOPS_AGE_KEY="${{ secrets.SOPS_AGE_KEY }}"
          node scripts/sync-env.mjs --env staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to staging
        run: railway up --service agr-client-portal --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
